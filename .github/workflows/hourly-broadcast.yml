name: Manual gold price broadcast fallback

on:
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Send LINE gold price broadcast
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://line-gold-price-bot-gamma.vercel.app/api/broadcast"
