name: Hourly gold price broadcast
# Authentication diagnostics verification

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hourly-broadcast.yml"

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Send LINE gold price broadcast
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://line-gold-price-bot-gamma.vercel.app/api/broadcast"
